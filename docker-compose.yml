version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: soroban-router-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soroban_router
      POSTGRES_USER: router_user
      POSTGRES_PASSWORD: router_password_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router_user -d soroban_router"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soroban-router-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: soroban-router-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://router_user:router_password_dev@postgres:5432/soroban_router
      REDIS_URL: redis://:redis_password_dev@redis:6379
      API_PORT: 3000
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    command: npm run dev

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    container_name: soroban-router-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://router_user:router_password_dev@postgres:5432/soroban_router
      REDIS_URL: redis://:redis_password_dev@redis:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      LOG_LEVEL: debug
      INDEXER_ENABLED: true
      ANALYTICS_ENABLED: true
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/worker/node_modules
    command: npm run dev

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: development
    container_name: soroban-router-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./apps/dashboard:/app/apps/dashboard
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/dashboard/.next
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: soroban-router-network
